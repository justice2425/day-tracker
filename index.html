<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>My Day</title>
<style>
  :root{
    --bg: var(--sn-stylekit-background-color, #fff7ed);
    --fg: var(--sn-stylekit-foreground-color, #1f2937);
    --panel: var(--sn-stylekit-contrast-background-color, #ffffff);
    --border: var(--sn-stylekit-border-color, #f0d9b8);
    --muted: var(--sn-stylekit-neutral-color, #7c6f64);
    --font: var(--sn-stylekit-editor-font-family, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif), "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif;
    --accent:#f59e0b; --accent2:#fb923c; --sky:#38bdf8; --grape:#a78bfa;
    --good:#16a34a; --good-bg:#dcfce7; --warn:#d97706; --gold:#f59e0b;
    --shadow:0 2px 0 rgba(0,0,0,.08);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.4;-webkit-text-size-adjust:100%}
  #root{max-width:560px;margin:0 auto;padding:12px 14px 90px}
  input,textarea,button{font-family:inherit}

  /* header: mascot greeting + stat chips */
  .hero{display:flex;align-items:center;gap:12px;background:linear-gradient(120deg,#fff7ed,#ffedd5);border:2px solid var(--border);border-radius:20px;padding:12px 14px;margin-bottom:12px}
  .mascot{font-size:2.6rem;line-height:1;filter:drop-shadow(0 2px 0 rgba(0,0,0,.06))}
  .hellowrap{flex:1;min-width:0}
  .hello{font-weight:800;font-size:1.15rem}
  .mascot-say{font-size:.85rem;color:var(--muted)}
  .chips{display:flex;gap:8px;margin-bottom:14px}
  .chip{flex:1;background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:9px 6px;text-align:center}
  .chip .cn{font-size:1.2rem;font-weight:800}
  .chip .cl{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .chip.streak .cn{color:var(--accent2)}
  .chip.level .cn{color:var(--grape)}
  .chip.points .cn{color:var(--sky)}

  /* level / xp bar */
  .levelbar{background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:10px 12px;margin-bottom:14px}
  .levelrow{display:flex;justify-content:space-between;font-weight:800;font-size:.9rem}
  .levelrow .sub{color:var(--muted);font-weight:600}
  .xpbar{height:12px;background:var(--border);border-radius:999px;overflow:hidden;margin-top:6px}
  .xpfill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:999px;transition:width .3s}

  /* cards */
  .card{background:var(--panel);border:2px solid var(--border);border-radius:20px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
  .card h2{margin:0 0 4px;font-size:1.05rem}
  .card .sub{color:var(--muted);font-size:.82rem;margin-bottom:10px}
  .section-title{font-weight:800;margin:2px 0 8px;font-size:1.1rem;display:flex;align-items:center;gap:8px}

  /* step ring */
  .ring-wrap{display:flex;align-items:center;gap:16px}
  .ring{width:120px;height:120px;flex:0 0 auto}
  .ring .bg{stroke:var(--border)}
  .ring .fg{stroke:url(#rg);stroke-linecap:round;transition:stroke-dashoffset .4s}
  .ring-mid{font-weight:800}
  .ring-steps{flex:1}
  .ring-steps label{font-size:.82rem;color:var(--muted);font-weight:700}
  .stepinput{width:100%;font-size:1.6rem;font-weight:800;border:2px solid var(--border);border-radius:14px;padding:10px 12px;margin-top:4px;background:var(--bg);color:var(--fg);text-align:center}
  .goaltag{font-size:.8rem;color:var(--muted);margin-top:6px}
  .stepbtns{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .stepbtn{border:2px solid var(--border);background:var(--panel);color:var(--fg);border-radius:999px;padding:6px 10px;font-weight:800;cursor:pointer;font-size:.82rem}
  .stepbtn:active{transform:translateY(1px)}

  /* rating faces */
  .faces{display:flex;justify-content:space-between;gap:6px}
  .face{flex:1;font-size:1.9rem;background:var(--bg);border:2px solid var(--border);border-radius:16px;padding:8px 0;cursor:pointer;line-height:1;transition:transform .1s}
  .face:active{transform:translateY(1px)}
  .face.on{border-color:var(--accent);background:#fffbeb;transform:scale(1.08)}

  /* goals checklist */
  .goals-list{display:flex;flex-direction:column;gap:8px}
  .goal{display:flex;align-items:center;gap:10px;border:2px solid var(--border);background:var(--bg);border-radius:14px;padding:10px 12px;cursor:pointer}
  .goal.done{border-color:var(--good);background:var(--good-bg)}
  .goal .ge{font-size:1.4rem}
  .goal .gn{flex:1;font-weight:700}
  .goal .gcheck{font-size:1.3rem;color:var(--muted)}
  .goal.done .gcheck{color:var(--good)}
  .empty{color:var(--muted);text-align:center;padding:14px;font-size:.9rem}

  /* text inputs */
  .field label{font-weight:800;display:block;margin:2px 0 6px}
  .field textarea, .field input[type=text]{width:100%;border:2px solid var(--border);border-radius:14px;padding:10px 12px;background:var(--bg);color:var(--fg);font-size:1rem;resize:vertical}
  .field textarea{min-height:64px}
  .field + .field{margin-top:12px}

  /* buttons */
  .primary{border:none;background:linear-gradient(120deg,var(--accent),var(--accent2));color:#fff;font-weight:800;border-radius:16px;padding:15px 22px;cursor:pointer;font-size:1.1rem;box-shadow:var(--shadow);width:100%}
  .primary:active{transform:translateY(2px)}
  .primary.saved{background:var(--good)}
  .ghost{border:2px solid var(--border);background:var(--panel);color:var(--fg);font-weight:800;border-radius:14px;padding:11px 16px;cursor:pointer}
  .ghost:active{transform:translateY(1px)}
  .rowbtns{display:flex;gap:10px}
  .rowbtns>*{flex:1}

  /* bottom nav */
  .nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--panel);border-top:2px solid var(--border);max-width:560px;margin:0 auto;z-index:10}
  .navbtn{flex:1;border:none;background:none;color:var(--muted);padding:8px 0 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:700}
  .navbtn .ni{font-size:1.4rem}
  .navbtn .nl{font-size:.68rem}
  .navbtn.on{color:var(--accent2)}
  .navbtn.on .ni{transform:translateY(-2px)}

  /* toast (rewards) */
  .toast{background:linear-gradient(90deg,#fef3c7,#fde68a);border:2px solid var(--gold);color:#7c2d12;border-radius:16px;padding:12px 14px;margin-bottom:12px;font-weight:800;text-align:center;animation:pop .25s ease}
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}

  /* history */
  .hlist{display:flex;flex-direction:column;gap:8px}
  .hrow{display:flex;align-items:center;gap:12px;border:2px solid var(--border);background:var(--panel);border-radius:14px;padding:10px 12px;cursor:pointer}
  .hrow .hface{font-size:1.5rem}
  .hrow .hinfo{flex:1}
  .hrow .hdate{font-weight:800}
  .hrow .hsteps{font-size:.8rem;color:var(--muted)}
  .hrow .hgo{color:var(--muted);font-weight:800}

  /* badges */
  .badges{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .badge{display:flex;align-items:center;gap:8px;border:2px solid var(--border);border-radius:14px;padding:10px;color:var(--muted);opacity:.65;background:var(--panel)}
  .badge.got{opacity:1;color:var(--fg);border-color:var(--gold)}
  .badge .be{font-size:1.5rem}
  .badge .bn{font-size:.82rem;font-weight:800}
  .badge .bd{font-size:.7rem;color:var(--muted)}

  /* rank ladder */
  .ladder{display:flex;flex-direction:column;gap:6px}
  .rl{display:flex;justify-content:space-between;align-items:center;border:2px solid var(--border);border-radius:12px;padding:9px 12px;font-weight:700;color:var(--muted)}
  .rl.got{color:var(--fg);border-color:var(--grape);background:var(--panel)}
  .rl.now{border-color:var(--accent);background:#fffbeb}

  /* goal editor */
  .goaledit{display:flex;flex-direction:column;gap:8px;border:2px dashed var(--border);border-radius:16px;padding:12px;margin-top:10px}
  .emojipick{display:flex;gap:6px;flex-wrap:wrap}
  .ep{font-size:1.3rem;border:2px solid var(--border);background:var(--panel);border-radius:12px;padding:4px 8px;cursor:pointer}
  .ep.on{border-color:var(--accent);background:#fffbeb}
  .del{border:none;background:none;color:#dc2626;font-weight:800;cursor:pointer;font-size:.85rem}
  .goalmanage{display:flex;align-items:center;gap:10px;border:2px solid var(--border);border-radius:14px;padding:10px 12px;background:var(--panel)}
  .goalmanage .gn{flex:1;font-weight:700}

  .backbar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .backbar h1{font-size:1.2rem;margin:0}
  .small{font-size:.8rem;color:var(--muted)}
  .center{text-align:center}
</style>
</head>
